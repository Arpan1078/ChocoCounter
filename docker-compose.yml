services:
  db:
    image: postgres:16-alpine
    container_name: chococounter-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./chococounter-db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-stores.sql:ro

  api:
    build:
      context: ./backend
    container_name: chococounter-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      UPLOAD_DIR: /app/uploads
      CATALOG_PATH: /seed/chocolates.json
      SEED_STORE_CODE: BRADLEY-FAIR
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - box_uploads:/app/uploads
      - ./chocolates.json:/seed/chocolates.json:ro

  frontend:
    image: nginx:1.27-alpine
    container_name: chococounter-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  box_uploads:
